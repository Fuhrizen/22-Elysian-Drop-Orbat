name: Deploy
'on':
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: null
permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  group: orbat-deploy
  cancel-in-progress: false
jobs:
  production:
    name: Main / Preserve data and reconcile production
    if: |-
      github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.event != 'pull_request'))
    uses: ./.github/workflows/deploy-target.yml
    secrets:
      admin_secret_key: ${{ secrets.admin_secret_key }}
    with:
      mode: production
  previews:
    name: Development / Sync PR containers and retain their databases
    needs: production
    if: |-
      always() && !cancelled() && github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository))
    permissions:
      contents: read
      actions: read
      pull-requests: write
    uses: ./.github/workflows/deploy-target.yml
    secrets:
      admin_secret_key: ${{ secrets.admin_secret_key }}
    with:
      mode: preview
