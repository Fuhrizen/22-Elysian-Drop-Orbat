name: Preview events
run-name: "PR #${{ github.event.pull_request.number }}"
on:
  pull_request:
    branches: [main]
    types: [converted_to_draft, closed]
permissions:
  contents: read
concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  cleanup:
    name: Request cleanup
    runs-on: ubuntu-24.04
    steps:
      - name: Queue cleanup
        run: echo 'Deploy will recheck live PR state before stopping or removing its preview.'

