name: Build
'on':
  workflow_call: null
permissions:
  contents: read
jobs:
  image:
    name: Image
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Prepare / Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.REVISION }}
          persist-credentials: false
      - name: Prepare / Node and locked dependencies
        uses: ./.github/actions/setup
      - name: Build / Next.js production output and TypeScript validation
        run: pnpm build
      - name: Package / Reuse the standalone build
        run: bash scripts/ci-image.sh package
      - name: Verify / Disposable image, readiness and access controls
        run: bash scripts/ci-image.sh smoke
      - name: Publish / Tested image for main or an internal PR
        if: github.event_name != 'pull_request' || (github.actor != 'dependabot[bot]' && github.event.pull_request.head.repo.full_name
          == github.repository && !github.event.pull_request.draft)
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            TARGET="pr-$(jq -r '.pull_request.number' "$GITHUB_EVENT_PATH")"
          else
            TARGET=main
          fi
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:${TARGET}-run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          docker tag orbat-ci:tested "$IMAGE"
          docker push "$IMAGE"
          # During rollout the current controller still consumes run-* tags.
          # Keep an alias on PR images; cleanup treats the paired tags as one version.
          if [[ "$TARGET" == pr-* ]]; then
            LEGACY="ghcr.io/${GITHUB_REPOSITORY,,}:run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            docker tag orbat-ci:tested "$LEGACY"
            docker push "$LEGACY"
          fi
          PACKAGE_NAME="${GITHUB_REPOSITORY#*/}"
          PACKAGE_URL="https://github.com/${GITHUB_REPOSITORY}/pkgs/container/${PACKAGE_NAME,,}"
          {
            printf '### Tested Docker image\n\n'
            printf '[Open container package](%s)\n\n' "$PACKAGE_URL"
            printf '**Image:** `%s`\n\n' "$IMAGE"
            printf '**Source revision:** `%s`\n\n' "$REVISION"
            printf 'Pull this exact tested image on the VM:\n\n'
            printf '```bash\ndocker pull %s\n```\n' "$IMAGE"
            printf '\nImage publication is complete; deployment is handled by the Deploy workflow.\n'
          } >> "$GITHUB_STEP_SUMMARY"

