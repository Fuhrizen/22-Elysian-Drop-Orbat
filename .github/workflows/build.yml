name: Build
run-name: Build - ${{ github.event.workflow_run.head_branch || github.ref_name }}
on:
  push:
    branches: [main]
  workflow_run:
    workflows: [CI]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: build-${{ github.event_name == 'push' && 'main' || github.event.workflow_run.head_branch }}
  cancel-in-progress: true
jobs:
  source:
    name: Source
    if: github.event_name == 'push' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      enabled: ${{ steps.source.outputs.enabled }}
      revision: ${{ steps.source.outputs.revision }}
      target: ${{ steps.source.outputs.target }}
      branch: ${{ steps.source.outputs.branch }}
    steps:
      - name: Check out trusted selector
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: .github/deploy
      - name: CI run ${{ github.event.workflow_run.id || 0 }}
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/deploy/build_selection.py
  image:
    name: Image
    needs: source
    if: needs.source.outputs.enabled == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      statuses: write
      actions: write
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      REVISION: ${{ needs.source.outputs.revision }}
    steps:
      - name: Prepare / Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.revision }}
          persist-credentials: false
      - name: Prepare / Node and locked dependencies
        uses: ./.github/actions/setup
      - name: Cache / Incremental Next.js compilation
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .next/cache
          # workflow_run caches are stored on main: target names isolate PR caches.
          key: next-v1-${{ runner.os }}-node24-${{ needs.source.outputs.target }}-${{ hashFiles('pnpm-lock.yaml', 'next.config.*', 'tsconfig.json', 'postcss.config.*') }}-${{ needs.source.outputs.revision }}
          restore-keys: |
            next-v1-${{ runner.os }}-node24-${{ needs.source.outputs.target }}-${{ hashFiles('pnpm-lock.yaml', 'next.config.*', 'tsconfig.json', 'postcss.config.*') }}-
            next-v1-${{ runner.os }}-node24-main-${{ hashFiles('pnpm-lock.yaml', 'next.config.*', 'tsconfig.json', 'postcss.config.*') }}-
      - name: Build / Next.js production output and TypeScript validation
        run: pnpm build
      - name: Package / Reuse the standalone build
        run: bash scripts/ci-image.sh package
      - name: Verify / Disposable image, readiness and access controls
        run: bash scripts/ci-image.sh smoke
      - name: Publish / Tested image for main or an internal PR
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          TARGET="${{ needs.source.outputs.target }}"
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:${TARGET}-run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          docker tag orbat-ci:tested "$IMAGE"
          docker push "$IMAGE"
          PACKAGE_NAME="${GITHUB_REPOSITORY#*/}"
          PACKAGE_URL="https://github.com/${GITHUB_REPOSITORY}/pkgs/container/${PACKAGE_NAME,,}"
          {
            printf '### Tested Docker image\n\n'
            printf '[Open container package](%s)\n\n' "$PACKAGE_URL"
            printf '**Image:** `%s`\n\n' "$IMAGE"
            printf '**Source revision:** `%s`\n\n' "$REVISION"
            printf 'Pull this exact tested image on the VM:\n\n'
            printf '```bash\ndocker pull %s\n```\n' "$IMAGE"
            printf '\nImage publication is complete; deployment is handled by the Deploy workflow.\n'
          } >> "$GITHUB_STEP_SUMMARY"


      - name: Check out trusted cleanup code
        if: always() && github.event_name == 'workflow_run'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: trusted-controller
          persist-credentials: false
          sparse-checkout: .github/deploy
      - name: Clean up late images if PR closed during build
        if: always() && github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 trusted-controller/.github/deploy/build_cleanup.py
      - name: Record build provenance
        env:
          SOURCE_CI: ${{ github.event.workflow_run.id || 0 }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          Path('release.json').write_text(json.dumps({'build_run':int(os.environ['GITHUB_RUN_ID']),'attempt':int(os.environ['GITHUB_RUN_ATTEMPT']),'ci_run':int(os.environ['SOURCE_CI']),'revision':os.environ['REVISION']}))
          PYTHON
      - name: Publish build provenance
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ github.run_attempt }}
          path: release.json
          retention-days: 7
          if-no-files-found: error
      - name: Queue deployment
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_BRANCH: ${{ needs.source.outputs.branch }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          from urllib.request import Request, urlopen
          body={'ref':'main','inputs':{'run_id':os.environ['GITHUB_RUN_ID'],'branch':os.environ['DEPLOY_BRANCH']}}
          req=Request('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/workflows/deploy.yml/dispatches',data=json.dumps(body).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
          with urlopen(req): pass
          PYTHON



      - name: Report preview build failure
        if: always() && github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          READINESS_STAGE: build
          BUILD_RESULT: ${{ job.status }}
        run: python3 trusted-controller/.github/deploy/preview_readiness.py

