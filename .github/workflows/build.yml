name: Build
run-name: Build - ${{ github.event.workflow_run.head_branch || github.ref_name }}
on:
  push:
    branches: [main]
  workflow_run:
    workflows: [CI]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: build-${{ github.event_name == 'push' && 'main' || github.event.workflow_run.head_branch }}
  cancel-in-progress: true
jobs:
  source:
    name: Source
    if: github.event_name == 'push' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      enabled: ${{ steps.source.outputs.enabled }}
      revision: ${{ steps.source.outputs.revision }}
      target: ${{ steps.source.outputs.target }}
      branch: ${{ steps.source.outputs.branch }}
    steps:
      - name: Check out trusted selector
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: .github/deploy
      - name: CI run ${{ github.event.workflow_run.id || 0 }}
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/deploy/build_selection.py
  image:
    name: Image
    needs: source
    if: needs.source.outputs.enabled == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      actions: write
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      REVISION: ${{ needs.source.outputs.revision }}
    steps:
      - name: Prepare / Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.revision }}
          persist-credentials: false
      - name: Prepare / Node and locked dependencies
        uses: ./.github/actions/setup
      - name: Build / Next.js production output and TypeScript validation
        run: pnpm build
      - name: Package / Reuse the standalone build
        run: bash scripts/ci-image.sh package
      - name: Verify / Disposable image, readiness and access controls
        run: bash scripts/ci-image.sh smoke
      - name: Publish / Tested image for main or an internal PR
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          TARGET="${{ needs.source.outputs.target }}"
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:${TARGET}-run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          docker tag orbat-ci:tested "$IMAGE"
          docker push "$IMAGE"
          # During rollout the current controller still consumes run-* tags.
          # Keep an alias on PR images; cleanup treats the paired tags as one version.
          if [[ "$TARGET" == pr-* ]]; then
            LEGACY="ghcr.io/${GITHUB_REPOSITORY,,}:run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            docker tag orbat-ci:tested "$LEGACY"
            docker push "$LEGACY"
          fi
          PACKAGE_NAME="${GITHUB_REPOSITORY#*/}"
          PACKAGE_URL="https://github.com/${GITHUB_REPOSITORY}/pkgs/container/${PACKAGE_NAME,,}"
          {
            printf '### Tested Docker image\n\n'
            printf '[Open container package](%s)\n\n' "$PACKAGE_URL"
            printf '**Image:** `%s`\n\n' "$IMAGE"
            printf '**Source revision:** `%s`\n\n' "$REVISION"
            printf 'Pull this exact tested image on the VM:\n\n'
            printf '```bash\ndocker pull %s\n```\n' "$IMAGE"
            printf '\nImage publication is complete; deployment is handled by the Deploy workflow.\n'
          } >> "$GITHUB_STEP_SUMMARY"


      - name: Check out trusted cleanup code
        if: always() && github.event_name == 'workflow_run'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: trusted-controller
          persist-credentials: false
          sparse-checkout: .github/deploy
      - name: Clean up late images if PR closed during build
        if: always() && github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 trusted-controller/.github/deploy/build_cleanup.py
      - name: Queue deployment
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_BRANCH: ${{ needs.source.outputs.branch }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          from urllib.request import Request, urlopen
          body={'ref':'main','inputs':{'run_id':os.environ['GITHUB_RUN_ID'],'branch':os.environ['DEPLOY_BRANCH']}}
          req=Request('https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/actions/workflows/deploy.yml/dispatches',data=json.dumps(body).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
          with urlopen(req): pass
          PYTHON
