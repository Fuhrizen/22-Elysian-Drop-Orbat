name: Essentials
on:
  workflow_call:
permissions:
  contents: read
jobs:
  verify:
    name: Verify application and dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Prepare / Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Prepare / Node and locked dependencies
        uses: ./.github/actions/setup
      - name: Verify / API, permissions and SQLite regressions
        run: pnpm test
      - name: Verify / Known high and critical dependency vulnerabilities
        run: pnpm audit --audit-level=high
  runtime:
    name: Build and verify production image
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Prepare / Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.REVISION }}
          persist-credentials: false
      - name: Prepare / Node and locked dependencies
        uses: ./.github/actions/setup
      - name: Build / Next.js production output and TypeScript validation
        run: pnpm build
      - name: Package / Reuse the standalone build
        run: bash scripts/ci-image.sh package
      - name: Verify / Disposable image, readiness and access controls
        run: bash scripts/ci-image.sh smoke
      - name: Publish / Tested image for main or an internal PR
        if: >-
          github.event_name != 'pull_request' ||
          (github.actor != 'dependabot[bot]' &&
           github.event.pull_request.head.repo.full_name == github.repository &&
           !github.event.pull_request.draft)
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
          docker tag orbat-ci:tested "$IMAGE"
          docker push "$IMAGE"
          printf '### Tested image\n`%s`\n\nRevision: `%s`\n' "$IMAGE" "$REVISION" >> "$GITHUB_STEP_SUMMARY"
