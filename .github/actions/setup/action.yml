name: Prepare Node and pnpm
description: Use the project's pinned package manager, cache its store and install the locked dependencies.
runs:
  using: composite
  steps:
    - name: Install the pinned pnpm version
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
    - name: Use Node 24 and restore the pnpm cache
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '24'
        cache: pnpm
    - name: Install the exact lockfile
      shell: bash
      run: pnpm install --frozen-lockfile
